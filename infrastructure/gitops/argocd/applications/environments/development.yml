apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vision-assistant-development
  namespace: argocd
  labels:
    app.kubernetes.io/name: vision-assistant
    app.kubernetes.io/component: environment
    environment: development
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: Prune=true
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/vision-assistant-infrastructure
    targetRevision: HEAD
    path: environments/development
  destination:
    server: https://kubernetes.default.svc
    namespace: vision-assistant-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
