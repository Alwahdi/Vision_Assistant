apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # Application Settings
  APP_NAME: "Vision Assistant"
  APP_VERSION: "1.0.0"
  APP_ENVIRONMENT: "production"

  # Server Settings
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "3000"
  SERVER_TIMEOUT: "30"

  # CORS Settings
  CORS_ORIGINS: "https://vision-assistant.com,https://app.vision-assistant.com"
  CORS_METHODS: "GET,POST,PUT,DELETE,OPTIONS"
  CORS_HEADERS: "Content-Type,Authorization,X-Requested-With"
  CORS_CREDENTIALS: "true"

  # Rate Limiting
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  RATE_LIMIT_SKIP_SUCCESSFUL_REQUESTS: "false"
  RATE_LIMIT_SKIP_FAILED_REQUESTS: "false"

  # Logging
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  LOG_TIMESTAMP_FORMAT: "iso"

  # Health Checks
  HEALTH_CHECK_ENABLED: "true"
  HEALTH_CHECK_INTERVAL: "30"
  HEALTH_CHECK_TIMEOUT: "10"
  HEALTH_CHECK_RETRIES: "3"

  # Metrics
  METRICS_ENABLED: "true"
  METRICS_PATH: "/metrics"
  METRICS_COLLECT_DEFAULT_METRICS: "true"

  # Tracing
  TRACING_ENABLED: "true"
  TRACING_SERVICE_NAME: "vision-assistant"
  TRACING_JAEGER_ENDPOINT: "http://jaeger-collector:14268/api/traces"

  # Cache Settings
  CACHE_ENABLED: "true"
  CACHE_TTL: "3600"
  CACHE_MAX_MEMORY: "512mb"

  # File Upload
  UPLOAD_MAX_SIZE: "50mb"
  UPLOAD_ALLOWED_TYPES: "image/jpeg,image/png,image/webp,audio/wav,audio/mp3"
  UPLOAD_DESTINATION: "/tmp/uploads"

  # AI Settings
  AI_MODEL_CACHE_SIZE: "2gb"
  AI_PROCESSING_TIMEOUT: "300"
  AI_MAX_CONCURRENT_REQUESTS: "10"
  AI_MODEL_PATH: "/app/models"

  # Security
  SECURITY_HELMET_ENABLED: "true"
  SECURITY_CSP_ENABLED: "true"
  SECURITY_HSTS_ENABLED: "true"
  SECURITY_NO_SNIFF: "true"
  SECURITY_XSS_PROTECTION: "true"

  # JWT Settings
  JWT_ALGORITHM: "RS256"
  JWT_ISSUER: "vision-assistant"
  JWT_AUDIENCE: "vision-assistant-users"
  JWT_ACCESS_TOKEN_EXPIRE: "900"
  JWT_REFRESH_TOKEN_EXPIRE: "604800"

  # OAuth Settings
  OAUTH_GOOGLE_ENABLED: "true"
  OAUTH_APPLE_ENABLED: "true"
  OAUTH_MICROSOFT_ENABLED: "false"

  # Feature Flags
  FEATURE_AI_PROCESSING: "true"
  FEATURE_REAL_TIME: "true"
  FEATURE_MULTILINGUAL: "true"
  FEATURE_OFFLINE_MODE: "false"
  FEATURE_ADVANCED_ANALYTICS: "true"
