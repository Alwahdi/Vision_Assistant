apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-config
data:
  # Prometheus Settings
  PROMETHEUS_ENABLED: "true"
  PROMETHEUS_SCRAPE_INTERVAL: "15s"
  PROMETHEUS_EVALUATION_INTERVAL: "15s"
  PROMETHEUS_SCRAPE_TIMEOUT: "10s"
  PROMETHEUS_RETENTION_TIME: "30d"
  PROMETHEUS_RETENTION_SIZE: "50GB"

  # Grafana Settings
  GRAFANA_ENABLED: "true"
  GRAFANA_ADMIN_USER: "admin"
  GRAFANA_DEFAULT_DASHBOARDS_ENABLED: "true"
  GRAFANA_PLUGINS: "grafana-piechart-panel,grafana-worldmap-panel"

  # Jaeger Settings
  JAEGER_ENABLED: "true"
  JAEGER_SERVICE_NAME: "vision-assistant"
  JAEGER_AGENT_HOST: "jaeger-agent"
  JAEGER_AGENT_PORT: "6831"
  JAEGER_SAMPLER_TYPE: "probabilistic"
  JAEGER_SAMPLER_PARAM: "0.1"

  # Loki Settings
  LOKI_ENABLED: "true"
  LOKI_RETENTION_PERIOD: "30d"
  LOKI_MAX_CHUNK_AGE: "2h"
  LOKI_MAX_QUERY_LENGTH: "721h"

  # Alert Manager
  ALERTMANAGER_ENABLED: "true"
  ALERTMANAGER_CLUSTER_ENABLED: "false"
  ALERTMANAGER_WEB_EXTERNAL_URL: "http://alertmanager.vision-assistant.com"

  # Custom Metrics
  METRICS_CUSTOM_ENABLED: "true"
  METRICS_BUSINESS_ENABLED: "true"
  METRICS_PERFORMANCE_ENABLED: "true"
  METRICS_SECURITY_ENABLED: "true"

  # Health Checks
  HEALTH_ENDPOINTS_ENABLED: "true"
  HEALTH_READINESS_ENABLED: "true"
  HEALTH_LIVENESS_ENABLED: "true"
  HEALTH_STARTUP_ENABLED: "true"

  # SLO Settings
  SLO_API_LATENCY_P95: "200ms"
  SLO_API_LATENCY_P99: "500ms"
  SLO_ERROR_RATE: "0.001"
  SLO_UPTIME: "99.9"

  # Log Settings
  LOG_AGGREGATION_ENABLED: "true"
  LOG_LEVEL_FILTERING: "true"
  LOG_SAMPLING_ENABLED: "false"
  LOG_SAMPLING_RATE: "0.1"

  # Tracing Settings
  TRACING_SAMPLING_RATE: "0.1"
  TRACING_PROPAGATION_FORMAT: "b3"
  TRACING_BAGGAGE_ENABLED: "true"

  # APM Settings
  APM_ENABLED: "true"
  APM_TRANSACTION_MAX_SPANS: "500"
  APM_STACK_TRACE_LIMIT: "50"
