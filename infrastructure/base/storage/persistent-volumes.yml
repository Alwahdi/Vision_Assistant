apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: vision-assistant-system
  annotations:
    volume.beta.kubernetes.io/storage-class: "fast-ssd"
    volume.kubernetes.io/selected-node: ""
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: fast-ssd
