apiVersion: integreatly.org/v1alpha1
kind: Grafana
metadata:
  name: vision-assistant-grafana
  namespace: vision-assistant-system
spec:
  baseImage: docker.io/grafana/grafana:latest
  config:
    auth:
      disable_login_form: false
      disable_signout_menu: false
    auth.anonymous:
      enabled: true
      org_name: Main Org.
      org_role: Viewer
    log:
      level: info
      mode: console
    security:
      admin_password: __vault__:secret/vision-assistant/grafana#admin_password
      admin_user: __vault__:secret/vision-assistant/grafana#admin_user
      secret_key: __vault__:secret/vision-assistant/grafana#secret_key
  dashboardLabelSelector:
  - matchExpressions:
    - key: app
      operator: In
      values:
      - grafana
  ingress:
    enabled: true
    hostname: grafana.vision-assistant.com
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    tls:
    - secretName: grafana-tls
      hosts:
      - grafana.vision-assistant.com
  resources:
    requests:
      memory: 100Mi
      cpu: 100m
    limits:
      memory: 500Mi
      cpu: 200m
  storage:
    type: pvc
    class: fast-ssd
    size: 10Gi
---
apiVersion: integreatly.org/v1alpha1
kind: GrafanaDashboard
metadata:
  name: vision-assistant-overview
  namespace: vision-assistant-system
  labels:
    app: grafana
spec:
  json: |
    {
      "dashboard": {
        "title": "Vision Assistant Overview",
        "tags": ["vision-assistant", "overview"],
        "timezone": "browser",
        "panels": [
          {
            "title": "API Response Time",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m]))",
                "legendFormat": "{{service}}"
              }
            ]
          },
          {
            "title": "Error Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(http_requests_total{status=~\"5..\"}[5m]) / rate(http_requests_total[5m]) * 100",
                "legendFormat": "{{service}}"
              }
            ]
          },
          {
            "title": "Active Users",
            "type": "singlestat",
            "targets": [
              {
                "expr": "sum(active_users)",
                "legendFormat": "Active Users"
              }
            ]
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "30s"
      }
    }
