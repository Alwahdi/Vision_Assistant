apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: vision-assistant-development
  namespace: vision-assistant-dev

# Base configuration
bases:
  - ../base

# Environment-specific patches
patchesStrategicMerge:
  - patches/namespace.yml
  - patches/configmaps.yml
  - patches/deployments.yml

# Environment-specific labels
commonLabels:
  environment: development
  team: developers

# Resource limits for development
patches:
  - target:
      kind: LimitRange
      name: container-limits
    patch: |-
      - op: replace
        path: /spec/limits/0/default/cpu
        value: "500m"
      - op: replace
        path: /spec/limits/0/default/memory
        value: 512Mi
      - op: replace
        path: /spec/limits/0/defaultRequest/cpu
        value: "100m"
      - op: replace
        path: /spec/limits/0/defaultRequest/memory
        value: 128Mi

# ConfigMap overrides for development
configMapGenerator:
  - name: app-config
    behavior: replace
    literals:
      - APP_ENVIRONMENT=development
      - LOG_LEVEL=debug
      - METRICS_ENABLED=true
      - TRACING_ENABLED=true
      - DEBUG_MODE=true
